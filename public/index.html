<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>My Money</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Inter']},colors:{surface:'#0f1419',container:'#151b24'}}}}</script>
  <style>body{overscroll-behavior:none}</style>
</head>
<body class="bg-surface text-slate-100 font-sans antialiased">
  <div class="min-h-screen flex flex-col items-center justify-center px-4">
    <div class="w-full max-w-sm">
      <div class="flex flex-col items-center mb-8">
        <div class="w-12 h-12 rounded-xl bg-emerald-500/10 flex items-center justify-center text-emerald-400 mb-3">
          <span class="material-symbols-outlined text-3xl">account_balance_wallet</span>
        </div>
        <h1 class="text-2xl font-semibold">My Money</h1>
        <p class="text-sm text-slate-400 mt-1">Administra tu dinero de forma simple</p>
      </div>
      <div id="auth-card" class="bg-container/90 backdrop-blur rounded-2xl border border-slate-800/60 shadow-lg p-6 space-y-5">
        <div class="flex gap-2 p-1 bg-slate-900/60 rounded-xl">
          <button id="tab-login" class="flex-1 py-2 text-sm rounded-lg bg-slate-800 text-slate-100 font-medium">Iniciar sesión</button>
          <button id="tab-register" class="flex-1 py-2 text-sm rounded-lg text-slate-400 hover:text-slate-200 transition">Crear cuenta</button>
        </div>
        <form id="form-login" class="space-y-4">
          <div class="space-y-2">
            <label class="text-xs text-slate-400">Usuario</label>
            <input id="login-user" class="w-full bg-slate-900/60 border border-slate-800 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/40" placeholder="tu_usuario" />
          </div>
          <div class="space-y-2">
            <label class="text-xs text-slate-400">Contraseña</label>
            <input id="login-pass" type="password" class="w-full bg-slate-900/60 border border-slate-800 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/40" placeholder="••••••" />
          </div>
          <button class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-medium py-2.5 rounded-xl transition active:scale-[0.995]">Entrar</button>
          <p id="login-err" class="text-xs text-red-400 text-center hidden"></p>
        </form>
        <form id="form-register" class="space-y-4 hidden">
          <div class="space-y-2">
            <label class="text-xs text-slate-400">Usuario</label>
            <input id="reg-user" class="w-full bg-slate-900/60 border border-slate-800 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/40" placeholder="elige_usuario" />
          </div>
          <div class="space-y-2">
            <label class="text-xs text-slate-400">Contraseña</label>
            <input id="reg-pass" type="password" class="w-full bg-slate-900/60 border border-slate-800 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/40" placeholder="mín 4 caracteres" />
          </div>
          <button class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-medium py-2.5 rounded-xl transition active:scale-[0.995]">Crear cuenta</button>
          <p id="reg-err" class="text-xs text-red-400 text-center hidden"></p>
        </form>
      </div>
      <div id="onboarding" class="bg-container/90 backdrop-blur rounded-2xl border border-slate-800/60 shadow-lg p-6 space-y-5 hidden">
        <div class="text-center space-y-2">
          <h2 class="text-lg font-semibold">Configura tu presupuesto</h2>
          <p class="text-sm text-slate-400">Todo empieza desde cero. Puedes cambiarlo cuando quieras.</p>
        </div>
        <div class="space-y-2">
          <label class="text-xs text-slate-400">Presupuesto mensual (MXN)</label>
          <input id="budget-input" type="number" step="0.01" min="0" class="w-full bg-slate-900/60 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-center text-lg focus:outline-none focus:ring-2 focus:ring-emerald-500/40" placeholder="0.00" />
        </div>
        <button id="btn-continue" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-medium py-2.5 rounded-xl transition">Continuar</button>
      </div>
    </div>
  </div>
  <script src="/auth.js"></script>
</body>
</html>
